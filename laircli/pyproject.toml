[project]
name = "laircli"
version = "0.1.0"
description = "OpenLair 命令行客户端：凭 X-API-Key 在终端记账、看待办、管习惯、查总览。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "rich>=13.7,<15.0",
    "typer>=0.15,<1.0",
]

[project.scripts]
lair = "laircli.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laircli"]

# ── uv 镜像源（国内加速，与 backend/pyproject.toml 一致）──
[tool.uv]
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
