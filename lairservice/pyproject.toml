[project]
name = "lairservice"
version = "0.1.0"
description = "FastAPI backend for Lair: unified envelope API, JWT auth, ledger/books/todo/calendar/notes/habits modules."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.15.0",
    "PyJWT>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
