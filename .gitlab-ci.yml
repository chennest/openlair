# openlair CI/CD — GitLab Runner (k8s executor, tag: k8s)
# 技术栈：backend = uv + FastAPI + pytest；lairweb = Vue3 + Vite + pnpm
# 镜像走 Harbor（harbor.lcc007.top/chennest/...）

# 需在 GitLab 项目 Settings → CI/CD → Variables 配置：
#   HARBOR_HOST=https://harbor.lcc007.top
#   HARBOR_USERNAME=admin
#   HARBOR_PASSWORD=xxxxx
#   HARBOR_PROJECT=chennest

stages:
  - test
  - build
  - package
  - deploy

variables:
  # 默认 job 镜像（k8s executor 的 build 容器，走 Harbor 加速）
  IMAGE_PYTHON: "harbor.lcc007.top/docker.io/library/python:3.14-slim"
  IMAGE_NODE: "harbor.lcc007.top/docker.io/library/node:22"
  # corepack 下载 pnpm 走国内镜像（npm 官方源走 Cloudflare，国内 CI 不稳定）
  COREPACK_NPM_REGISTRY: "https://registry.npmmirror.com"

# ============================================================
# Stage 1: backend 测试（uv + pytest）
# ============================================================
backend-test:
  stage: test
  tags: [k8s]
  image: ${IMAGE_PYTHON}
  before_script:
    # 从清华源安装 uv（PyPI 官方源国内慢）
    - pip install --no-cache-dir -i https://pypi.tuna.tsinghua.edu.cn/simple uv
  script:
    - cd backend
    - uv sync --extra dev
    - uv run pytest -v
  artifacts:
    when: always
    reports:
      junit: backend/test-results.xml
    expire_in: 1 week
  rules:
    # 只在 test 分支推送或打 Git tag 时构建镜像
    - if: '$CI_COMMIT_BRANCH == "test"'
    - if: '$CI_COMMIT_TAG'
# ============================================================
# Stage 2: lairweb 构建（pnpm + Vite typecheck & build）
# ============================================================
web-build:
  stage: build
  tags: [k8s]
  image: ${IMAGE_NODE}
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.15.0 --activate
  script:
    - cd lairweb
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths:
      - lairweb/dist/
    expire_in: 1 week
  rules:
    # 只在 test 分支推送或打 Git tag 时构建镜像
    - if: '$CI_COMMIT_BRANCH == "test"'
    - if: '$CI_COMMIT_TAG'
# ============================================================
# Stage 3: backend 镜像构建 + 推送 Harbor（buildah，无需 Docker daemon）
# 镜像名: $HARBOR_HOST/$HARBOR_PROJECT/openlair-backend:<tag>
# tag 策略：
#   Git tag（v1.2.3）→ 镜像 tag = v1.2.3（生产发版）
#   分支推送      → 镜像 tag = <分支名>-<pipeline序号>（如 test-12、dev-5）
# buildah 优势：不需要特权模式/DinD，K8s job Pod 内直接构建
# ============================================================
backend-package:
  stage: package
  tags: [k8s]
  image: harbor.lcc007.top/quay.io/buildah/stable:v1.37
  script:
    # 登录 Harbor
    # ⚠️ buildah login 选项必须在前（旧版不支持 registry 在前的顺序，报 too many arguments）
    # ⚠️ printf 不带换行（echo 会加 \n，Harbor 拒绝带换行密码 → invalid username/password）
    - printf '%s' "$HARBOR_PASSWORD" | buildah login -u "$HARBOR_USERNAME" --password-stdin $HARBOR_HOST
    # tag 策略：Git tag 优先，否则分支名-pipeline序号
    - if [ -n "$CI_COMMIT_TAG" ]; then TAG="${CI_COMMIT_TAG}"; else TAG="${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_IID}"; fi
    # 构建（buildah bud = build）
    - buildah bud -t "$IMAGE_NAME:${TAG}" backend/
    # 推送
    - buildah push "$IMAGE_NAME:${TAG}"
    # 清理
    - buildah logout $HARBOR_HOST
  rules:
    # 只在 test 分支推送或打 Git tag 时构建镜像
    - if: '$CI_COMMIT_BRANCH == "test"'
    - if: '$CI_COMMIT_TAG'
  variables:
    # buildah 存储位置：容器内临时目录（避免权限问题）
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    IMAGE_NAME: "$HARBOR_HOST/$HARBOR_PROJECT/openlair-backend"

# ============================================================
# Stage 3: lairweb 镜像构建 + 推送 Harbor（buildah，多阶段构建）
# 镜像名: $HARBOR_HOST/$HARBOR_PROJECT/openlair-web:<tag>
# tag 策略与 backend 一致：Git tag → 版本号；分支 → 分支名-序号
# ============================================================
web-package:
  stage: package
  tags: [k8s]
  image: harbor.lcc007.top/quay.io/buildah/stable:v1.37
  script:
    # ⚠️ printf 不带换行（echo 会加 \n，Harbor 拒绝带换行密码 → invalid username/password）
    - printf '%s' "$HARBOR_PASSWORD" | buildah login -u "$HARBOR_USERNAME" --password-stdin $HARBOR_HOST
    - if [ -n "$CI_COMMIT_TAG" ]; then TAG="${CI_COMMIT_TAG}"; else TAG="${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_IID}"; fi
    # 多阶段构建（Dockerfile 在 lairweb/ 下）
    - buildah bud -t "$IMAGE_NAME:${TAG}" lairweb/
    - buildah push "$IMAGE_NAME:${TAG}"
    - buildah logout $HARBOR_HOST
  rules:
    # 只在 test 分支推送或打 Git tag 时构建镜像
    - if: '$CI_COMMIT_BRANCH == "test"'
    - if: '$CI_COMMIT_TAG'
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    IMAGE_NAME: "$HARBOR_HOST/$HARBOR_PROJECT/openlair-web"

# ============================================================
# Stage 4: 部署 test 环境（K8s，通过 agent k8s-test 隧道）
# 触发：test 分支推送
# 部署：kubectl apply -k overlays/test + 镜像 tag 注入
# ============================================================
deploy-test:
  stage: deploy
  tags: [k8s]
  image: harbor.lcc007.top/docker.io/bitnami/kubectl:latest
  environment:
    name: test
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
  before_script:
    # GitLab 自动注入 kubeconfig（server=KAS），切到 test 集群的 agent context
    - kubectl config get-contexts
    - kubectl config use-context chennest/openlair:k8s-test
  script:
    - cd k8s/overlays/test
    # 注入本次构建的镜像 tag（test-<pipeline序号>）——单引号防 YAML 解析冒号
    - 'sed -i "s|newTag: .*|newTag: test-${CI_PIPELINE_IID}|" kustomization.yaml'
    # 部署
    - kubectl apply -k .
    - kubectl rollout status deployment/openlair-backend -n openlair --timeout=5m
    - kubectl rollout status deployment/openlair-web -n openlair --timeout=5m
