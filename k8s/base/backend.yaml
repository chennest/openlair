# openlair backend — Deployment + Service（base 模板）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlair-backend
  labels:
    app: openlair-backend
spec:
  selector:
    matchLabels:
      app: openlair-backend
  template:
    metadata:
      labels:
        app: openlair-backend
    spec:
      # 从私有 Harbor 拉镜像需要凭据（chennest 项目非公开）
      # secret 由 kubectl create secret docker-registry 手动建，不入库（密码不进 git）
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: backend
          # 镜像 tag 由 overlay/CI 覆盖（images 或 set image）
          image: harbor.lcc007.top/chennest/openlair-backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          # 环境变量由 CI 从 ENV_FILE 生成 ConfigMap 注入
          envFrom:
            - configMapRef:
                name: openlair-env
                optional: true
            - secretRef:
                name: openlair-secrets
                optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 20
---
# Service：集群内访问 openlair-backend:8001
apiVersion: v1
kind: Service
metadata:
  name: openlair-backend
spec:
  selector:
    app: openlair-backend
  ports:
    - port: 8001
      targetPort: 8001
