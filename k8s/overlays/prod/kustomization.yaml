# 生产环境 overlay — 域名 + 环境标签 + 镜像 tag
# ⚠️ 生产暂不监控：只引用 base（不含 servicemonitor.yaml，见 ../monitoring）。
#    生产集群未装 Prometheus Operator，ServiceMonitor CRD 不存在会导致 apply 失败；
#    等生产部署监控后再在 resources 里加 - ../../monitoring。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# 环境标签（官方推荐 labels 字段，只加 label 不动 selector）
labels:
  - pairs:
      app.kubernetes.io/environment: prod
      app.kubernetes.io/managed-by: kustomize

# 镜像 tag（生产 latest 兜底；CI deploy-prod 用 sed 注入 Git tag，如 v1.2.3）
images:
  - name: harbor.lcc007.top/chennest/openlair-backend
    newTag: latest
  - name: harbor.lcc007.top/chennest/openlair-web
    newTag: latest

# 副本数（官方 replicas 字段，不用 patch）
# ⚠️ 后端跑 SQLite（单文件库），多副本会写冲突，保持 1；web 无状态可横向扩展
replicas:
  - name: openlair-backend
    count: 1
  - name: openlair-web
    count: 1

# 域名 + IngressClass 覆盖：JSON6902 精确替换（避开 strategic merge 列表合并坑 #5713）
# ⚠️ 生产集群是 k3s 默认 Traefik，test 集群是 APISIX——IngressClass 必须按环境区分
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: openlair
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: traefik
      - op: replace
        path: /spec/rules/0/host
        value: lair.lcc007.top
      - op: replace
        path: /spec/tls/0/hosts/0
        value: lair.lcc007.top
